<!doctype html>
<!-- The landing page's social card (website/img/social.png), laid out at 1200×630 and rendered at 2x.
     Render: node tools/social-image/render.cjs -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; color: #1d1d1f;
    background: radial-gradient(120% 90% at 100% 100%, #e3ecfb 0%, #f6f6f8 55%, #ffffff 100%);
    -webkit-font-smoothing: antialiased;
  }
  .copy { position: absolute; left: 72px; top: 76px; width: 470px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; letter-spacing: -0.015em; }
  .brand img { width: 64px; height: 64px; margin: -8px -2px -8px -8px; }
  h1 { margin-top: 46px; font-size: 54px; line-height: 1.06; letter-spacing: -0.035em; font-weight: 650; }
  p { margin-top: 24px; font-size: 22px; line-height: 1.4; color: rgba(60, 60, 67, 0.72); }
  .shot {
    position: absolute; left: 590px; top: 92px; width: 1000px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 40px 90px -20px rgba(20, 20, 40, 0.32), 0 12px 28px -8px rgba(20, 20, 40, 0.16);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../website/img/app-icon.png" alt="">Draftmux</div>
    <h1>Polish what your agent writes before it goes out</h1>
    <p>Edit PR descriptions, issues and Slack updates with Claude Code or pi, beside a live preview.</p>
  </div>
  <div class="shot"><img src="../../website/img/app-light.webp" alt=""></div>
</body>
</html>
