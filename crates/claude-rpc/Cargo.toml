[package]
name = "draftmux-claude-rpc"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
draftmux-agent = { path = "../agent" }
draftmux-process = { path = "../process" }
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Scripted stand-in for claude used by the integration tests.
[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"
test = false
doc = false

[target.'cfg(unix)'.dependencies]
# fake-claude's signal and stdin directives.
libc = "0.2"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
draftmux-core = { path = "../core" }
draftmux-storage = { path = "../storage" }
tempfile = "3.27.0"
uuid = { version = "1.29.1", features = ["v4"] }
