[package]
name = "markup"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde_yaml_ng = "0.10"
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
comrak = { version = "0.59", default-features = false }
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49"
pulldown-cmark = { version = "0.13.6", default-features = false }
