name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI before publishing.
  workflow_call:
  workflow_dispatch:

# A called workflow sees its caller's name in github.workflow, which keeps a
# release's CI from cancelling, or being cancelled by, CI for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-machete
      - run: cargo fmt --all -- --check
      - run: cargo machete
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::all
      - run: cargo check --locked -p draftmux --features capture
      - run: cargo test --locked --workspace
      - run: just test-scripts

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build libraries and zsh for the shell-env tests
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libzstd-dev zsh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::all
      - run: cargo test --locked --workspace

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Git for Windows checks out text files with CRLF line endings, which
      # tests reading repository files don't expect.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::all
      - run: cargo test --locked --workspace

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: shellcheck install.sh scripts/* hooks/*
      - run: npm test
        working-directory: pi-extension
